name: Backend CI and deployment

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build executable JAR
        run: |
          bash ./gradlew --no-daemon bootJar
          mkdir -p artifact
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" artifact/app.jar
          cd artifact
          sha256sum app.jar > app.jar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test against isolated H2 and mocked S3
        run: bash ./gradlew --no-daemon test
      - name: Test deployment failure and rollback paths
        run: |
          bash -n deploy/deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: build/reports/tests/test/
          retention-days: 7

  deploy:
    needs: [build, test]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOCUMENT_NAME: ${{ vars.DEPLOY_DOCUMENT_NAME }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require deployment configuration
        run: |
          : "${AWS_REGION:?Missing AWS_REGION}"
          : "${ARTIFACT_BUCKET:?Missing ARTIFACT_BUCKET}"
          : "${INSTANCE_ID:?Missing EC2_INSTANCE_ID}"
          : "${DOCUMENT_NAME:?Missing DEPLOY_DOCUMENT_NAME}"
          : "${ROLE_ARN:?Missing AWS_DEPLOY_ROLE_ARN}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ github.sha }}
          path: artifact
      - name: Verify build artifact
        working-directory: artifact
        run: sha256sum --check app.jar.sha256
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: riku-${{ github.run_id }}
      - name: Publish the tested build and deploy through SSM
        run: python3 deploy/run-command.py
